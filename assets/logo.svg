<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1c" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.25" />
    </linearGradient>

    <!-- Amber Core Glow -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb020" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#ffb020" stop-opacity="0" />
    </radialGradient>

    <!-- Amber Metallic Gradient -->
    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f" />
      <stop offset="50%" stop-color="#ffb020" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Chassis Gradient -->
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glow Filter with generous bounds to prevent square clipping -->
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base (padded safely within 512x512) -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#bg)" stroke="url(#borderGlow)" stroke-width="4" />

  <!-- Radial Core Ambient Glow -->
  <circle cx="256" cy="265" r="170" fill="url(#amberGlow)" />

  <!-- Concentric Wi-Fi Arcs -->
  <path d="M 132 205 A 150 150 0 0 1 380 205" fill="none" stroke="url(#amberMetal)" stroke-width="12" stroke-linecap="round" opacity="0.3" />
  <path d="M 170 240 A 108 108 0 0 1 342 240" fill="none" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" opacity="0.65" />
  <path d="M 210 275 A 60 60 0 0 1 302 275" fill="none" stroke="url(#amberMetal)" stroke-width="16" stroke-linecap="round" filter="url(#softGlow)" />

  <!-- Antenna Left -->
  <path d="M 172 320 L 142 152" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
  <circle cx="142" cy="152" r="11" fill="#ffe58f" filter="url(#dotGlow)" />

  <!-- Antenna Center -->
  <path d="M 256 308 L 256 126" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
  <circle cx="256" cy="126" r="12" fill="#ffe58f" filter="url(#dotGlow)" />

  <!-- Antenna Right -->
  <path d="M 340 320 L 370 152" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
  <circle cx="370" cy="152" r="11" fill="#ffe58f" filter="url(#dotGlow)" />

  <!-- Router Gateway Base Chassis -->
  <rect x="110" y="324" width="292" height="68" rx="20" fill="url(#chassis)" stroke="#334155" stroke-width="3" />
  
  <!-- Subtle Chassis Top Highlight -->
  <line x1="134" y1="326" x2="378" y2="326" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" />

  <!-- Port / Activity LED Nodes -->
  <circle cx="152" cy="358" r="7" fill="#22c55e" filter="url(#dotGlow)" />
  <circle cx="182" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
  <circle cx="212" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
  <circle cx="242" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
  <circle cx="272" cy="358" r="7" fill="#38bdf8" filter="url(#dotGlow)" />

  <!-- Gigabit Link Waveforms on Base Chassis -->
  <rect x="312" y="352" width="68" height="12" rx="6" fill="#090e1a" stroke="rgba(255, 176, 32, 0.4)" stroke-width="1.5" />
  <rect x="316" y="355" width="28" height="6" rx="3" fill="#ffb020" />
</svg>