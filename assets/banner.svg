<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="60%" stop-color="#0b1528" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>

    <linearGradient id="amberMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe58f" />
      <stop offset="50%" stop-color="#ffb020" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect x="0" y="0" width="1000" height="300" rx="24" fill="url(#bgBanner)" stroke="rgba(255, 176, 32, 0.3)" stroke-width="2" />

  <!-- Logo Icon Group (scaled and shifted left) -->
  <g transform="translate(60, 40) scale(0.43)">
    <!-- Squircle Base -->
    <rect x="20" y="20" width="472" height="472" rx="104" fill="#080e1c" stroke="rgba(255, 176, 32, 0.6)" stroke-width="4" />
    
    <!-- Concentric Wi-Fi Arcs -->
    <path d="M 132 205 A 150 150 0 0 1 380 205" fill="none" stroke="url(#amberMetal)" stroke-width="12" stroke-linecap="round" opacity="0.3" />
    <path d="M 170 240 A 108 108 0 0 1 342 240" fill="none" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" opacity="0.65" />
    <path d="M 210 275 A 60 60 0 0 1 302 275" fill="none" stroke="url(#amberMetal)" stroke-width="16" stroke-linecap="round" filter="url(#softGlow)" />

    <!-- Antenna Left -->
    <path d="M 172 320 L 142 152" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
    <circle cx="142" cy="152" r="11" fill="#ffe58f" filter="url(#dotGlow)" />

    <!-- Antenna Center -->
    <path d="M 256 308 L 256 126" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
    <circle cx="256" cy="126" r="12" fill="#ffe58f" filter="url(#dotGlow)" />

    <!-- Antenna Right -->
    <path d="M 340 320 L 370 152" stroke="url(#amberMetal)" stroke-width="14" stroke-linecap="round" />
    <circle cx="370" cy="152" r="11" fill="#ffe58f" filter="url(#dotGlow)" />

    <!-- Router Chassis -->
    <rect x="110" y="324" width="292" height="68" rx="20" fill="url(#chassis)" stroke="#334155" stroke-width="3" />
    <line x1="134" y1="326" x2="378" y2="326" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-linecap="round" />

    <!-- LEDs -->
    <circle cx="152" cy="358" r="7" fill="#22c55e" filter="url(#dotGlow)" />
    <circle cx="182" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
    <circle cx="212" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
    <circle cx="242" cy="358" r="7" fill="#ffb020" filter="url(#dotGlow)" />
    <circle cx="272" cy="358" r="7" fill="#38bdf8" filter="url(#dotGlow)" />

    <rect x="312" y="352" width="68" height="12" rx="6" fill="#090e1a" stroke="rgba(255, 176, 32, 0.4)" stroke-width="1.5" />
    <rect x="316" y="355" width="28" height="6" rx="3" fill="#ffb020" />
  </g>

  <!-- Typography Brand Text -->
  <text x="320" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">darkstrap<tspan fill="#ffb020">.</tspan></text>
  
  <!-- Subtitle -->
  <text x="324" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">Obsidian &amp; amber dark theme for OpenWrt LuCI</text>

  <!-- Pill tags -->
  <g transform="translate(324, 218)">
    <rect x="0" y="0" width="118" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="59" y="17" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">OpenWrt 25.x</text>

    <rect x="126" y="0" width="98" height="26" rx="6" fill="#1e293b" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
    <text x="175" y="17" font-family="monospace" font-size="12" fill="#cbd5e1" text-anchor="middle">Responsive</text>

    <rect x="232" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="rgba(255, 176, 32, 0.3)" stroke-width="1" />
    <text x="287" y="17" font-family="monospace" font-size="12" fill="#ffb020" text-anchor="middle">v0.9.9.5</text>
  </g>
</svg>